server:
  servlet:
    context-path: /manage_store/v1
  port: 8080

spring:
  application:
    name: manage-store-showroom
  output:
    ansi:
      enabled: always
  datasource:
    url: ${MYSQL_URL_DATABASE}
    username: ${MYSQL_USER}
    password: ${MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    show-sql: false

  flyway:
    enabled: true
    url: ${MYSQL_URL_DATABASE}
    user: ${MYSQL_USER}
    password: ${MYSQL_PASSWORD}
    locations: classpath:db/migration
cors:
  allowedorigins: ${CORS_ALLONEORIGINS}

# Habilita todos os endpoints do Actuator
management:
  endpoints:
    web:
      exposure:
        include: "*"
#logging:
#  file:
#    name: logs/application.log
#  level:
#    root: error
logging:
  level:
    br:
      com:
        manage:
          store=ERROR:
